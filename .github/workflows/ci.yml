name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Generation allergy checks
        run: npm run validate:generation
      - name: Shopping list units
        run: npm run validate:shopping
      - name: Plan audit assertions (100+ plans × 3 diets)
        run: npm run validate:audit
      - name: Production build
        run: npm run build
